[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "*/migrations/*",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "DJ",  # flake8-django
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"*/tests.py" = ["B011", "DJ001"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "manage.py",
    "config/wsgi.py",
    "config/asgi.py",
    ".venv/*",
    "venv/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
