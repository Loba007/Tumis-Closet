# Production-like local stack: PostgreSQL + the API in a container.
# The frontend is deployed separately (Vercel) and talks to this API.
#
#   cp backend/.env.example backend/.env   # then edit values
#   docker compose up --build
#
# The API is served at http://localhost:8000 with the health check at /health/.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tunmis_closet
      POSTGRES_USER: tunmis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tunmis -d tunmis_closet"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://tunmis:${POSTGRES_PASSWORD:-devpassword}@db:5432/tunmis_closet
      ALLOWED_HOSTS: localhost,127.0.0.1,api
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000
             --workers 3 --timeout 60 --access-logfile - --error-logfile -"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
